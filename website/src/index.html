<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#233d34">
<title>Map – Bushline Maps</title>
<meta name="description" content="The Bushline Maps 3D topo map of New Zealand: LINZ aerial imagery and NZ Topo over real terrain, every DOC walk and hut, hunting areas, and a route planner that follows the tracks.">
<link rel="canonical" href="{{site.domain}}/">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/img/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="/img/kea-180.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:site_name" content="Bushline Maps">
<meta property="og:title" content="Bushline Maps – the 3D topo map of New Zealand">
<meta property="og:description" content="Real 3D terrain, every DOC walk and hut, and routes that follow the tracks.">
<meta property="og:image" content="{{site.domain}}/img/og.jpg">
<meta property="og:url" content="{{site.domain}}/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://basemaps.linz.govt.nz" crossorigin>
<link rel="preconnect" href="https://services1.arcgis.com" crossorigin>
<link rel="preconnect" href="{{overviewOrigin}}" crossorigin>
<link rel="modulepreload" href="{{maplibre}}/maplibre-gl.mjs">
<link rel="modulepreload" href="/js/map/main.js">
<link rel="preload" href="/data/topography-style.json" as="fetch" crossorigin>
<link rel="preload" href="/data/overview.json" as="fetch" crossorigin>
<link rel="preload" href="/data/gaps-index.json" as="fetch" crossorigin>
<link rel="stylesheet" href="{{maplibre}}/maplibre-gl.css">
<link rel="stylesheet" href="/css/map.css">
</head>
<body class="map-page">
<h1 class="visually-hidden">Bushline Maps – 3D topo map of New Zealand</h1>
<div id="map" aria-label="Map of New Zealand"></div>
<p id="map-status" class="map-status" role="status"><span class="spinner"></span>Bringing the mountains into view…</p>
<div class="progress" aria-hidden="true"></div>

<!-- The app's map chrome: kea (routes and search) and locate on the left;
     2D | 3D, compass and layers on the right; scale and credits at the bottom. -->
<button id="launcher" class="launcher" type="button" aria-label="Search and saved routes" aria-controls="drawer" aria-expanded="false" title="Bushline Maps – search and routes"><img src="/img/kea-96.png" alt="" width="44" height="44"></button>
<button id="locate" class="tile locate" type="button" aria-label="Show my location"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 5V1M12 23v-4M5 12H1M23 12h-4"/><circle cx="12" cy="12" r="3" class="fill"/></svg></button>
<div id="perspective" class="perspective" role="group" aria-label="Map perspective"><button type="button" data-view="2d" aria-label="Show the map in 2D">2D</button><button type="button" data-view="3d" aria-label="Show the map in 3D">3D</button></div>
<button id="compass" class="tile compass" type="button" aria-label="Reset bearing to north"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 2.5 8.6 12h6.8Z" class="n"/><path d="M12 21.5 15.4 12H8.6Z" class="s"/></svg></button>
<button id="layers-button" class="tile layers" type="button" aria-label="Map layers" aria-expanded="false" aria-controls="layers-panel"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12.5 9 5 9-5M3 17l9 5 9-5"/></svg></button>
<div id="notes" class="notes" aria-live="polite"><div id="drawing-note" class="toast" hidden></div><div id="toast" class="toast" role="status" hidden></div></div>

<div id="drawer-cover" class="drawer-cover" hidden>
  <aside id="drawer" class="drawer" aria-label="Search and saved routes">
    <form id="search" class="search" role="search" autocomplete="off">
      <div class="field"><input type="search" placeholder="Search places, huts, tracks" aria-label="Search places, huts and tracks" role="combobox" aria-autocomplete="list" aria-expanded="false" enterkeyhint="search" spellcheck="false"><button class="search-clear" type="button" aria-label="Clear search" hidden>✕</button></div>
      <button id="drawer-close" class="close" type="button" aria-label="Close saved routes">✕</button>
    </form>
    <div id="drawer-body" class="drawer-body"></div>
    <a class="btn primary block drawer-offline" href="/about/#app">Offline regions · get the app</a>
  </aside>
</div>

<section id="layers-panel" class="layers-panel" hidden aria-label="Map layers"></section>
<aside id="sheet" class="sheet" hidden></aside>
<noscript><p class="map-status">The map needs JavaScript. Everything else on this site works without it.</p></noscript>
<script type="module" src="/js/map/main.js"></script>
</body>
</html>
